version: '3.8'

services:
  proxy:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web-secure.address=:443"
      - "--certificatesresolvers.myresolver.acme.email=josephjomon401@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.keystore.path=/usr/share/elasticsearch/config/certs/elasticsearch.p12
      - xpack.security.http.ssl.keystore.password=passphrase
      - xpack.security.http.ssl.truststore.path=/usr/share/elasticsearch/config/certs/truststore.p12
      - xpack.security.http.ssl.truststore.password=passphrase
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=elapas
      - http.cors.enabled=true
      - http.cors.allow-origin="*"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticssl:/usr/share/elasticsearch/config/certs:ro
      - ./elasticssl/elasticsearch.p12:/usr/share/elasticsearch/config/certs/elasticsearch.p12:ro

  databaseservice:
    image: josephf50/es_vdb_secure
    container_name: databaseservice_container
    environment:
      - ELASTICSEARCH_HOST=https://elasticsearch:9200
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=elapas
      - ELASTICSEARCH_CERT_PATH=/usr/share/databaseservice/certs/elasticsearch.crt
      - TIMEOUT=30
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.databaseservice.entrypoints=web-secure"
      - "traefik.http.routers.databaseservice.rule=Host(`vdb.kundalin.com`)"
      - "traefik.http.routers.databaseservice.tls=true"
      - "traefik.http.routers.databaseservice.tls.certresolver=myresolver"
      - "traefik.http.services.databaseservice.loadbalancer.server.port=8000"
    depends_on:
      - elasticsearch
    volumes:
      - ./elasticssl/elasticsearch.crt:/usr/share/databaseservice/certs/elasticsearch.crt:ro

volumes:
  es_data:
